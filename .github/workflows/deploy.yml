name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: astro-site/package-lock.json

      - name: Install dependencies
        working-directory: astro-site
        run: npm ci

      - name: Build
        working-directory: astro-site
        run: npm run build

      - name: Inject EmailJS + reCAPTCHA secrets
        working-directory: astro-site/dist
        run: |
          find . -name "*.html" -exec sed -i "s|RECAPTCHA_SITE_KEY_PLACEHOLDER|${{ secrets.RECAPTCHA_SITE_KEY }}|g" {} +
          find . -name "*.html" -exec sed -i "s|EMAILJS_PUBLIC_KEY_PLACEHOLDER|${{ secrets.EMAILJS_PUBLIC_KEY }}|g" {} +
          sed -i "s|EMAILJS_SERVICE_ID_PLACEHOLDER|${{ secrets.EMAILJS_SERVICE_ID }}|g" index.html
          sed -i "s|EMAILJS_TEMPLATE_ID_PLACEHOLDER|${{ secrets.EMAILJS_TEMPLATE_ID }}|g" index.html

      - name: Copy CNAME
        run: cp CNAME astro-site/dist/CNAME

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: astro-site/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
